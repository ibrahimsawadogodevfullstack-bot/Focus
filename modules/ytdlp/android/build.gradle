apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.ytdlp'
version = '0.1.0'

android {
  namespace "expo.modules.ytdlp"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }

  lintOptions {
    abortOnError false
  }
}

repositories {
  mavenCentral()
}

dependencies {
  // yt-dlp + Python embarqués (bibliothèque Android), publiée sur Maven Central.
  // La version ffmpeg doit être identique à celle de la bibliothèque.
  implementation("io.github.junkfood02.youtubedl-android:library:0.18.1")
  implementation("io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1")
}
